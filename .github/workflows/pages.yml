name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Las versiones de las acciones no son cosmetica: cada action declara
      # con que Node corre su propio codigo (`runs.using`), y eso es
      # independiente del `node-version` de abajo. checkout@v4, setup-node@v4
      # y deploy-pages@v4 declaran node20, que Actions ya no ejecuta: los
      # forzaba a node24 y anotaba la corrida. De v5 en adelante declaran
      # node24 y la anotacion desaparece.
      - name: Checkout
        uses: actions/checkout@v7

      # node-version es otra cosa: el Node con el que corren npm ci y los
      # scripts del repositorio. Node 20 salio de soporte en abril de 2026.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install repo dependencies
        run: npm ci

      # Corre antes de armar el sitio: si un documento de dominio cita una
      # norma, un articulo o un identificador que no existe, no se publica.
      # No verifica que lo que dicen sea cierto —eso se hace leyendo el
      # motor— pero una cita inventada no llega a produccion.
      #
      # honorio/ no esta en el runner, asi que los identificadores del
      # motor salen como no verificables y no hacen fallar. Lo que si
      # falla aca son las citas de normas y articulos, que es la clase de
      # error que costo mas cara.
      - name: Verificar citas de la documentacion de dominio
        run: npm run verificar-docs

      # El presupuesto de docs/ESTADO.md. Se lee entero al empezar cada
      # sesion de trabajo, asi que cada linea de mas se paga en todas las
      # que vengan. Corre aca ---y no solo en el hook--- porque el hook se
      # saltea con --no-verify y porque una rama que engorda el documento
      # tiene que verse antes de mergearse, no despues.
      - name: Verificar el presupuesto de ESTADO.md
        run: npm run verificar-estado

      # El motor de Escribiente: conversion a Markdown, rechazo del PDF sin
      # OCR, anonimizacion y rangos de paginas. Corre aca por el mismo motivo
      # que el de arriba: la herramienta de la que salio estuvo meses
      # publicada perdiendo el contenido de las resoluciones de una carilla y
      # convirtiendo montos en [DNI], sin que nada lo notara.
      - name: Verificar el motor de Escribiente
        run: npm run verificar-escribiente

      # Las dos series de valores que muestra uma-uhom.html. Se editan a mano
      # cada vez que sale un acto nuevo, y las tres formas en que un archivo
      # asi se rompe --vigencia repetida, serie que baja, acto anterior a la
      # vigencia-- dan las tres un numero plausible que nadie ve en el diff.
      - name: Verificar las series de UMA y UHOM
        run: npm run verificar-series

      # Los tokens de color, que estan escritos seis veces porque son
      # paginas sin build. Dos formas de fallar y las dos son invisibles
      # mirando una pantalla: un token de texto que no llega a AA sobre
      # alguna de las tres superficies --asi vivio --faint cuatro
      # semanas, bien sobre la tarjeta y mal sobre el fondo-- y seis
      # copias que dejan de decir lo mismo, que es como la plantilla de
      # los documentos de dominio se quedo con los valores de antes del
      # 5/8. No necesita honorio/ ni red: corre siempre.
      - name: Verificar el contraste de los tokens
        run: npm run verificar-contraste

      # Los dos conectores: se levanta cada proceso --el HTTP en un puerto
      # propio, el MCP por stdio-- y se les pega. No cubren aritmetica,
      # que ya cubre verificar-plazos: cubren que arranquen, que el
      # formato no cambie, y sobre todo que cuando falta un dato NO
      # devuelvan una fecha. Del otro lado de un conector no hay nadie
      # leyendo un aviso al lado del numero.
      - name: Verificar los conectores
        run: npm run verificar-conectores

      # El computo de plazos, y con el la API que el repositorio `ledger`
      # carga desde este sitio (el bloque del ledger, al final del script).
      # Corre aca y no solo en el cron de feriados porque plazos.js y
      # calendario-judicial.js se sirven tal cual a otro repositorio: un cambio
      # que les rompe la API no puede llegar a produccion, porque alla no da
      # error, deja de mostrar vencimientos.
      - name: Verificar el computo de plazos
        run: npm run verificar-plazos

      # Que terceros nombran las paginas que se publican. Existe porque el
      # 26/8/2026 se contesto "que sale del navegador" leyendo las once
      # calculadoras una por una, y la respuesta se dejo afuera a prorrateo,
      # que le pedia la UMA a una planilla de Google desde una llamada
      # escondida a cuatrocientas lineas del calculo. Un host nuevo no rompe
      # nada visible, asi que sin este control entra en silencio.
      # La tabla del anexo de la Acordada 5/2010 se transcribio de una IMAGEN
      # escaneada: 45 filas por cinco columnas, o sea 225 oportunidades de
      # errar un digito, y un digito de mas en una distancia devuelve un plazo
      # plausible y equivocado. La propia tabla trae con que controlarse ---los
      # dias publicados salen de las distancias por una regla escrita--- y eso
      # es lo que se comprueba.
      - name: Verificar la tabla de la Acordada 5/2010
        run: npm run verificar-acordada

      # El computo de la ampliacion por distancia, y sobre todo la busqueda en
      # esa tabla: un nombre que no matchea cae en silencio a la ruta y da otro
      # numero; uno que matchea de mas da los dias de otra ciudad.
      - name: Verificar el computo de la ampliacion por distancia
        run: npm run verificar-distancia

      - name: Verificar que terceros nombra el sitio
        run: npm run verificar-red

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p site

          # Lista explicita (allowlist), no blacklist: entra a produccion
          # solo lo que se nombra aca. Si sumas algo, enlazalo desde
          # index.html o no va a existir para nadie.
          cp index.html site/
          cp documentacion.html site/
          cp quien-soy.html site/
          cp uma-uhom.html site/
          # GitHub Pages sirve /404.html, con estado 404, en cualquier
          # direccion que no exista. Tiene que ir en la raiz del sitio y con
          # todas sus rutas absolutas: el porque esta adentro del archivo.
          cp 404.html site/
          cp -r assets site/
          cp -r calculadoras site/
          cp -r data site/
          cp -r asistente-honorarios-clasico site/
          cp -r "proyectos finalizados" "site/proyectos finalizados"

          # Escribiente: PWA estatica de vanilla JS, todo del lado del
          # navegador. La carpeta del repositorio ya es la raiz servible, asi
          # que se copia entera —incluido vendor/, que son pdf.js y pdf-lib
          # versionados adentro del repositorio a proposito: una herramienta
          # que promete que el documento no sale de la maquina no puede
          # cargar el codigo que lo lee desde un CDN de un tercero.
          cp -r escribiente site/escribiente

          # PDF-studio se rehizo entero y paso a llamarse Escribiente el
          # 17/8. La URL vieja estuvo publicada meses y sigue viva con un
          # aviso, que es la regla de la casa: retirar algo no puede ser
          # dejar un 404.
          cp -r redirects/pdf-studio site/PDF-studio

          # /honorio/ ya no sirve la app: Honorio vive en honorio.ar,
          # en su propio repositorio. Queda una pagina de redireccion para
          # que los enlaces viejos —los que ya andan dando vueltas— no
          # mueran en un 404.
          cp -r redirects/honorio site/honorio

          # calculadoras/honorarios.html se retiro el 7/8: su "grupo 4"
          # aplicaba la reduccion del art. 22 sobre la escala en vez de
          # sobre la base, o sea devolvia un numero mas alto que el
          # correcto. Se dio de baja en lugar de corregirse porque
          # Honorio ya la reemplaza. El archivo queda en el repositorio
          # como historia; lo que se publica en su URL es el aviso, para
          # que ningun enlace viejo muera en un 404 ni entregue un
          # numero equivocado.
          cp redirects/honorarios-retirada/index.html site/calculadoras/honorarios.html

      # docs/domain/ renderizado a HTML. Va despues del ensamblado
      # porque escribe dentro de site/.
      - name: Build domain docs
        run: npm run docs -- site/docs

      # Esta es composite: el node20 que anotaba Actions venia del
      # actions/upload-artifact que usa adentro, no de ella. Hasta v4 pinea
      # upload-artifact@v4 (node20); v5 pasa a v7 (node24).
      #
      # Desde v4 excluye del artefacto los archivos y carpetas que empiezan
      # con punto, salvo que se le pase include-hidden-files: true. Hoy no
      # se publica ninguno —el ensamblado de arriba es una allowlist y no
      # nombra ninguno—, pero si algun dia entra uno, va a faltar en el
      # sitio sin que nada falle.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v4 tambien declara node20; la anotacion que se leyo era la del job
      # de build y no lo nombraba, pero es el mismo caso.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Lo que el `ledger` carga de este sitio, mirado en produccion y despues de
  # publicar. Desde el 11/9/2026 aquel repositorio carga los dos motores y los
  # tres JSON del calendario desde javiercuneo.com.ar, en el navegador y desde
  # otro origen: los JSON los pide con fetch, asi que ademas de existir tienen
  # que venir con Access-Control-Allow-Origin. Eso lo pone GitHub Pages solo y
  # no se configura desde aca, pero tampoco se ve desde Node: un archivo que se
  # mueve, o un encabezado que Pages deja de mandar, dejaria al ledger sin
  # vencimientos y sin ningun error. Si esto falla, el sitio ya se publico: la
  # falla es el aviso.
  publicado:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verificar lo que el ledger carga del sitio
        run: |
          set -uo pipefail
          sitio="https://javiercuneo.com.ar"
          fallas=0
          for ruta in calculadoras/js/calendario-judicial.js calculadoras/js/plazos.js \
                      data/feriados.json data/dias-inhabiles.json data/feria-judicial.json; do
            encabezados=$(curl -sSI --retry 3 --retry-delay 10 -H "Origin: https://ejemplo.invalid" "$sitio/$ruta" | tr -d '\r')
            if ! printf '%s\n' "$encabezados" | head -1 | grep -q ' 200'; then
              echo "::error::$ruta no responde 200: $(printf '%s\n' "$encabezados" | head -1)"
              fallas=$((fallas + 1))
            elif ! printf '%s\n' "$encabezados" | grep -qi '^access-control-allow-origin: \*$'; then
              echo "::error::$ruta viene sin Access-Control-Allow-Origin: *"
              fallas=$((fallas + 1))
            else
              echo "ok  $ruta"
            fi
          done
          exit $fallas
